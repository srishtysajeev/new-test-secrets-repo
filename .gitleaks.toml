title = "Custom Gitleaks config for detecting all sample secrets"

[extend]
useDefault = true


###############################################################
# Custom rules to guarantee detection of your specific secrets
###############################################################

# Detect password-like fields such as "password_token"
[[rules]]
id = "custom-password-token"
description = "Detect password-like fields including password_token"
regex = '''(?i)(password|password_token|passwd|pwd)\s*[:=]\s*["']?[A-Za-z0-9!@#$%^&*._-]{6,}["']?'''
severity = "HIGH"

# Detect AWS Access Keys even if embedded in YAML or other formats
[[rules]]
id = "custom-aws-access-key"
description = "Detect AWS Access Key (AKIA...)"
regex = '''AKIA[0-9A-Z]{16}'''
severity = "HIGH"

# Detect AWS Secret Keys including inline forms like AWS_SECRET_ACCESS_KEY=...
[[rules]]
id = "custom-aws-secret-key"
description = "Detect AWS Secret Access Key"
regex = '''(?i)(aws_secret_access_key|secret_access_key)\s*[:=]\s*["']?[A-Za-z0-9\/+=]{20,}["']?'''
severity = "HIGH"
